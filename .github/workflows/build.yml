name: Build Releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        run: pyinstaller --noconfirm --onefile --noconsole --icon "assets/icon.ico" --add-data "assets;assets" --name instad instad.py

      - name: Build Installer (Inno Setup)
        run: |
          iscc setup.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instad-windows-installer
          path: |
            dist/Instad-Setup-x64.exe
            dist/instad.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: pyinstaller --noconfirm --onefile --windowed --icon "assets/icon.png" --add-data "assets:assets" --name instad instad.py

      - name: Rename Linux binary
        run: mv dist/instad dist/instad-linux-x64

      - name: Create Linux Release Archive
        run: tar -czvf instad-linux-x64.tar.gz dist/instad-linux-x64 README.md

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: instad-linux-x64
          path: instad-linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: instad-windows-installer

      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: instad-linux-x64
          path: . # Download to current directory

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Instad-Setup-x64.exe
            instad.exe
            instad-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
